<!DOCTYPE html>
<html>
<head>
    <title>Age Checker</title>
</head>

<body>

    <h1>აბა აბა ფულს გადმომირიცხავ?</h1>

    <p> 1=არა 2=კი </p>

    <input id="age" type="number" placeholder="აქ ჩაწერე">

    <button onclick="checkAge()">შემოწმება</button>

    <p id="result"></p>

    <script>
        function checkAge() {
            let age = document.getElementById("age").value;

            if (age >= 2) {
                document.getElementById("result").innerText =
                    "good boyyy!";
            } else {
                document.getElementById("result").innerText =
                    "დამეხიე აგერ!";
            }
        }
    </script>

</body>
</html>
