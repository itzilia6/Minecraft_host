<!DOCTYPE html>
<html>
<head>
    <title>Age Checker</title>
</head>

<body>

    <h1>ასაკის შემოწმება</h1>

    <p>შეიყვანე შენი ასაკი:</p>

    <input id="age" type="number" placeholder="ასაკი">

    <button onclick="checkAge()">შემოწმება</button>

    <p id="result"></p>

    <script>
        function checkAge() {
            let age = document.getElementById("age").value;

            if (age >= 18) {
                document.getElementById("result").innerText =
                    "შენ სრულწლოვანი ხარ!";
            } else {
                document.getElementById("result").innerText =
                    "შენ ჯერ არასრულწლოვანი ხარ!";
            }
        }
    </script>

</body>
</html>
